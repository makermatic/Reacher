<title>Studio Outreach Tracker</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: Kitsu-style production sheet. Top bar, quick-update bar, sheet or board filling the screen; a company page docks on the right like Kitsu's task panel. */
:root{
  --bg:#ECF0EE; --surface:#FFFFFF; --surface-2:#F4F7F5; --hover:#EEF3F0;
  --line:#DAE1DD; --line-strong:#C2CCC7; --fg:#16201C; --muted:#5D6B65; --faint:#8C9893;
  --accent:#08924A; --accent-ink:#FFFFFF; --accent-soft:#DCF2E5;
  --c-grey:#7F8B86; --c-blue:#2C67D6; --c-teal:#0E8A93; --c-green:#08924A; --c-amber:#A86F00; --c-pink:#C8317A; --c-red:#B0473A; --c-violet:#6B4FD0;
  --chip-ink:#FFFFFF;
  --miss-bg:#FFE7B8; --miss-fg:#6E4300; --late:#B0473A;
  --shadow:0 12px 40px rgba(18,32,26,.16);
  --f-display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --f-body:"IBM Plex Sans","Segoe UI",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121715; --surface:#1A201E; --surface-2:#202725; --hover:#252D2A;
  --line:#2D3633; --line-strong:#3E4945; --fg:#E3EBE7; --muted:#9AA8A2; --faint:#6F7C77;
  --accent:#2ED27A; --accent-ink:#04220F; --accent-soft:#183A28;
  --c-grey:#7C8984; --c-blue:#5C93FF; --c-teal:#3CCFD8; --c-green:#2ED27A; --c-amber:#EDB23A; --c-pink:#FF6DAE; --c-red:#E8705F; --c-violet:#A08BFF;
  --chip-ink:#0E1311;
  --miss-bg:#4A3511; --miss-fg:#FFD68A; --late:#FF8A78;
  --shadow:0 12px 40px rgba(0,0,0,.5);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#121715; --surface:#1A201E; --surface-2:#202725; --hover:#252D2A;
  --line:#2D3633; --line-strong:#3E4945; --fg:#E3EBE7; --muted:#9AA8A2; --faint:#6F7C77;
  --accent:#2ED27A; --accent-ink:#04220F; --accent-soft:#183A28;
  --c-grey:#7C8984; --c-blue:#5C93FF; --c-teal:#3CCFD8; --c-green:#2ED27A; --c-amber:#EDB23A; --c-pink:#FF6DAE; --c-red:#E8705F; --c-violet:#A08BFF;
  --chip-ink:#0E1311;
  --miss-bg:#4A3511; --miss-fg:#FFD68A; --late:#FF8A78;
  --shadow:0 12px 40px rgba(0,0,0,.5);
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:14px;line-height:1.45}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{height:100%;display:flex;flex-direction:column;gap:10px;padding-block:12px 14px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.c-grey{--c:var(--c-grey)}.c-blue{--c:var(--c-blue)}.c-teal{--c:var(--c-teal)}.c-green{--c:var(--c-green)}.c-amber{--c:var(--c-amber)}.c-pink{--c:var(--c-pink)}.c-red{--c:var(--c-red)}.c-violet{--c:var(--c-violet)}

/* top bar */
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:10px;min-width:0}
.brand h1{font-family:var(--f-display);font-weight:700;font-size:22px;letter-spacing:-.01em;margin:0;text-wrap:balance}
.brand .prod{font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.spacer{flex:1}
.seg{display:flex;border:1px solid var(--line-strong);border-radius:7px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:var(--surface);padding:5px 11px;color:var(--muted)}
.seg button+button{border-left:1px solid var(--line-strong)}
.seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--fg);font-weight:500}
.btn{border:1px solid var(--line-strong);background:var(--surface);border-radius:8px;padding:6px 12px;transition:background .15s,border-color .15s,filter .15s;font-weight:500;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;text-decoration:none;color:var(--fg)}
.btn:hover{background:var(--hover)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.05)}
.btn.ghost{border-color:transparent;background:none}
.btn.ghost:hover{background:var(--hover)}
.btn.small{padding:3px 8px;font-size:12.5px}
.btn.danger{color:var(--c-red)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.mode{font-family:var(--f-mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;padding:3px 8px;border-radius:99px;border:1px solid var(--line-strong);color:var(--muted)}

/* quick update + notices */
.quick-wrap{position:relative;z-index:15}
.quick{display:flex;gap:8px;align-items:stretch;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:6px 6px 6px 14px;box-shadow:0 1px 2px rgba(0,0,0,.05);transition:border-color .15s,box-shadow .15s}
.quick .q-label{font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);align-self:center;white-space:nowrap}
.quick input{flex:1;min-width:0;border:0;background:none;padding:6px 4px;outline:none;font-size:14.5px}
.quick:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 18%,transparent)}
#notice{position:absolute;left:0;right:0;top:calc(100% + 6px)}
.notice{background:var(--surface);border:1px solid var(--line-strong);border-radius:12px;padding:12px 14px;display:grid;gap:8px;box-shadow:var(--shadow)}
.notice.done{border-left:3px solid var(--accent)}
.notice .n-head{display:flex;align-items:center;gap:10px;justify-content:space-between}
.notice .n-head b{font-weight:600}
.notice .n-msg{font-weight:500}
.notice ul{margin:0;padding-left:18px;display:grid;gap:3px}
.notice .n-actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.cands{display:flex;gap:8px;flex-wrap:wrap}
.cand{border:1px solid var(--line-strong);background:var(--surface);border-radius:8px;padding:7px 10px;text-align:left;display:grid;gap:1px;max-width:280px}
.cand:hover{border-color:var(--accent);background:var(--hover)}
.cand small{color:var(--muted);font-size:12px}
.banner{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:13px;color:var(--muted);padding:6px 12px;border:1px dashed var(--line-strong);border-radius:8px}
.banner b{color:var(--fg);font-weight:600}

/* toolbar */
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.toolbar .search{border:1px solid var(--line-strong);background:var(--surface);border-radius:7px;padding:6px 10px;width:220px;max-width:100%}
.count{font-family:var(--f-mono);font-size:12px;color:var(--muted);margin-right:auto}
.view{flex:1;min-height:0;display:flex;flex-direction:column;gap:10px}

/* sheet */
.grid-wrap{flex:1;min-height:0;overflow:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
table.grid{border-collapse:separate;border-spacing:0;min-width:100%;font-size:13.5px}
.grid th,.grid td{border-bottom:1px solid var(--line);border-right:1px solid color-mix(in srgb,var(--line) 55%,transparent);padding:0;text-align:left;vertical-align:middle;white-space:nowrap}
.grid thead th{position:sticky;top:0;z-index:2;background:var(--surface-2);font-weight:600;font-size:12.5px;color:var(--muted)}
.grid .sticky-col{position:sticky;left:0;z-index:1;background:var(--surface);min-width:200px;max-width:270px}
.grid thead .sticky-col{z-index:3;background:var(--surface-2)}
.grid tbody tr:hover td{background:var(--hover)}
.grid tbody tr.open td{background:var(--accent-soft)}
.h-btn{display:flex;flex-direction:column;gap:3px;width:100%;border:0;background:none;padding:7px 10px 6px;text-align:left;font-weight:600}
.h-btn:hover{background:var(--hover)}
.h-type{font-family:var(--f-mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);font-weight:500}
.dist{display:flex;height:4px;border-radius:2px;overflow:hidden;background:var(--line);min-width:110px}
.dist span{display:block;height:100%;background:var(--c)}
.th-plain{padding:7px 10px;font-weight:600}
.co-cell{display:flex;align-items:center;gap:4px;padding-right:4px}
.co-name{flex:1;min-width:0;border:0;background:none;text-align:left;padding:10px 12px;font-weight:600;overflow:hidden;text-overflow:ellipsis}
.co-name:hover{text-decoration:underline;text-decoration-color:var(--line-strong)}
.ex{font-family:var(--f-mono);font-size:9.5px;letter-spacing:.06em;color:var(--muted);border:1px solid var(--line-strong);border-radius:4px;padding:0 4px}
.icon-btn{border:0;background:none;color:var(--faint);padding:4px 6px;border-radius:5px;line-height:1}
.icon-btn:hover{background:var(--line);color:var(--fg)}
.st-cell{padding:5px 8px !important}
.st-wrap{display:flex;align-items:center;gap:6px}
.schip{font-family:var(--f-mono);font-weight:600;font-size:11px;letter-spacing:.03em;border-radius:5px;padding:3px 8px;min-width:84px;text-align:center;border:1px solid transparent;background:var(--c);color:var(--chip-ink);white-space:nowrap}
.schip:hover{filter:brightness(1.07)}
.schip.empty{background:transparent;border-color:var(--line-strong);color:var(--faint);font-weight:500}
.due{font-family:var(--f-mono);font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.due.late{color:var(--late);font-weight:600}
.due.today{color:var(--c-amber);font-weight:600}
.m-cell{cursor:pointer;padding:7px 10px !important;max-width:240px;overflow:hidden;text-overflow:ellipsis}
.m-cell.num{text-align:right;font-variant-numeric:tabular-nums;font-family:var(--f-mono);font-size:12.5px}
.m-cell.date{font-family:var(--f-mono);font-size:12.5px}
.empty-v{color:var(--faint)}
a.lnk{color:var(--accent);text-decoration:none}
a.lnk:hover{text-decoration:underline}
.ai{font-family:var(--f-mono);font-size:9px;letter-spacing:.05em;color:var(--accent);border:1px solid color-mix(in srgb,var(--accent) 45%,transparent);border-radius:3px;padding:0 3px;margin-left:5px;vertical-align:1px}
.person{display:inline-flex;flex-direction:column;line-height:1.2}
.person small{color:var(--muted);font-size:11.5px}
.tag{display:inline-block;font-size:12px;padding:1px 7px;border-radius:99px;background:color-mix(in srgb,var(--c) 18%,var(--surface));color:var(--fg);border:1px solid color-mix(in srgb,var(--c) 35%,var(--surface));margin-right:3px}
.cl{display:inline-flex;align-items:center;gap:6px;font-family:var(--f-mono);font-size:12px}
.cl .bar{width:44px;height:4px;border-radius:2px;background:var(--line);overflow:hidden}
.cl .bar span{display:block;height:100%;background:var(--accent)}
.cb{width:16px;height:16px;border:1.5px solid var(--line-strong);border-radius:4px;display:inline-grid;place-items:center;vertical-align:middle}
.cb.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.add-row td{border-bottom:0}
.add-row input{border:0;background:none;padding:9px 10px;width:100%;outline:none}
.add-row input::placeholder{color:var(--faint)}
.add-col-th{padding:4px 8px !important;border-right:0 !important}
.empty-grid{padding:40px 20px;text-align:center;color:var(--muted)}

/* board */
.kanban{flex:1;min-height:0;overflow:auto;display:flex;gap:10px;padding-bottom:4px;align-items:stretch}
.lane{background:var(--surface-2);border:1px solid var(--line);border-radius:10px;display:flex;flex-direction:column;min-height:0;flex:1 0 220px;max-width:340px}
.lane.collapsed{flex:0 0 46px;cursor:pointer;box-shadow:inset 0 4px 0 var(--c);overflow:hidden}
.lane.collapsed:hover{background:var(--hover)}
.lane.collapsed .lane-body{display:none}
.lane.collapsed .lane-h{border-bottom:0;height:100%;justify-items:center;align-content:start;padding:10px 0}
.lane.collapsed .lane-h .g,.lane.collapsed .lane-h .bar{display:none}
.lane.collapsed .lane-h .t{writing-mode:vertical-rl;transform:rotate(180deg);flex-direction:row-reverse;gap:8px}
.lane-name{font-weight:600}
.lane-h[data-act]{cursor:pointer;border-radius:10px 10px 0 0}
.lane-h[data-act]:hover{background:var(--hover)}
.lane-h[data-act]:hover .lane-name{text-decoration:underline;text-underline-offset:3px}
.lane.over{border-color:var(--accent);background:var(--accent-soft)}
.lane-h{display:grid;gap:4px;padding:9px 12px;border-bottom:1px solid var(--line)}
.lane-h .g{font-family:var(--f-mono);font-size:10px;letter-spacing:.09em;text-transform:uppercase;color:var(--faint);min-height:1em}
.lane-h .t{display:flex;justify-content:space-between;align-items:center;font-weight:600}
.lane-h .n{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.lane-h .bar{height:3px;border-radius:2px;background:var(--c)}
.lane-body{padding:8px;display:flex;flex-direction:column;gap:8px;overflow:auto;min-height:60px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:grid;gap:6px;cursor:grab;text-align:left;transition:border-color .15s,box-shadow .15s}
.card:hover{border-color:var(--line-strong);box-shadow:0 2px 8px rgba(0,0,0,.06)}
.card:active{cursor:grabbing}
.card.dragging{opacity:.45}
.card-name{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card-meta{display:flex;flex-wrap:wrap;gap:4px;align-items:center;font-size:12px;color:var(--muted)}
.lane-empty{font-size:12.5px;color:var(--faint);padding:6px 4px}

/* company page (docked panel) */
#resizer{position:fixed;top:0;bottom:0;width:10px;right:calc(min(var(--pw,640px),100vw) - 5px);cursor:col-resize;z-index:22;touch-action:none}
#resizer::after{content:"";position:absolute;left:4px;top:0;bottom:0;width:2px;background:transparent;transition:background .15s}
#resizer:hover::after,#resizer.drag::after{background:var(--accent)}
body.panel-push .app{padding-right:calc(var(--pw,640px) + 16px)}
@media (max-width:720px){#resizer{display:none}}
.panel{position:fixed;top:0;right:0;bottom:0;width:min(var(--pw,640px),100%);background:var(--surface);border-left:1px solid var(--line);box-shadow:var(--shadow);z-index:20;overflow:auto;
  padding-top:calc(20px + env(safe-area-inset-top,0px));padding-bottom:calc(28px + env(safe-area-inset-bottom,0px));padding-left:26px;padding-right:max(26px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:26px}
.p-head{display:flex;align-items:flex-start;gap:8px}
.p-head h2{font-family:var(--f-display);font-weight:700;font-size:26px;margin:0;line-height:1.1;text-wrap:balance}
.p-title{border:0;background:none;padding:0;text-align:left;flex:1;min-width:0}
.p-title:hover h2{text-decoration:underline;text-decoration-color:var(--line-strong)}
.p-status{display:flex;flex-wrap:wrap;gap:14px;align-items:flex-end}
.p-status .field{gap:4px}
.eyebrow{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600}
.props{display:grid;grid-template-columns:minmax(120px,170px) minmax(0,1fr);border-top:1px solid var(--line)}
.prop-k,.prop-v{border-bottom:1px solid var(--line);padding:7px 8px;min-height:36px;display:flex;align-items:center}
.prop-k{color:var(--muted);font-size:13px;gap:6px}
.prop-k .hidden-note{font-family:var(--f-mono);font-size:9px;color:var(--faint);letter-spacing:.05em}
.prop-v{cursor:pointer;min-width:0;flex-wrap:wrap;gap:3px;overflow-wrap:anywhere}
.prop-v:hover{background:var(--hover)}
.prop-v.long{white-space:pre-wrap;align-items:flex-start}
.sec{display:grid;gap:10px}
.sec-h{display:flex;align-items:center;justify-content:space-between;gap:8px;border-bottom:1px solid var(--line);padding-bottom:8px;cursor:grab}
.sec-h:active{cursor:grabbing}
.sec-h .sec-t{display:flex;align-items:center;gap:6px;border:0;background:none;padding:0;text-align:left;flex:1;min-width:0}
.sec-h .chev{color:var(--muted);font-size:12px;width:12px}
.grip{color:var(--faint);padding:2px 2px;font-size:13px;line-height:1;letter-spacing:-2px;opacity:0;transition:opacity .15s}
.sec-h:hover .grip{opacity:1}
.psec.over > .sec-h{border-bottom-color:var(--accent)}
.psec.dragging{opacity:.5}
.psec.collapsed > :not(.sec-h){display:none}
.sec-h h3{font-family:var(--f-display);font-weight:700;font-size:16px;margin:0;letter-spacing:-.005em}
.sec-h .n{font-family:var(--f-mono);font-size:12px;color:var(--muted);margin-left:6px;font-weight:500}
.chain{border:1px solid var(--line);border-radius:10px;overflow:hidden}
.chain-h{display:flex;align-items:center;gap:8px;padding:9px 12px;background:var(--surface-2);border-bottom:1px solid var(--line)}
.chain-h .ttl{font-weight:600;border:0;background:none;padding:0;text-align:left;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chain-h .meta{font-family:var(--f-mono);font-size:11px;color:var(--muted);white-space:nowrap}
.chain-b{padding:10px 12px;display:grid;gap:8px}
.summary{background:var(--accent-soft);border-radius:8px;padding:9px 12px;white-space:pre-wrap;font-size:13.5px}
.summary.none{background:var(--surface-2);color:var(--muted)}
.stale{font-size:12px;color:var(--c-amber)}
.msg{border:1px solid var(--line);border-radius:8px;padding:8px 10px;display:grid;gap:4px}
.msg.out{border-left:3px solid var(--c-blue)}
.msg.in{border-left:3px solid var(--c-pink)}
.msg-h{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted)}
.msg-h .who{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;font-weight:600;color:var(--fg)}
.msg-h .x{margin-left:auto}
.msg-body{white-space:pre-wrap;font-size:13px;max-height:9.5em;overflow:hidden}
.msg-body.open{max-height:none}
.more{border:0;background:none;color:var(--accent);padding:0;font-size:12px;justify-self:start}
.entry{display:grid;grid-template-columns:96px minmax(0,1fr) auto;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);align-items:start}
.entry .d{font-family:var(--f-mono);font-size:12px;color:var(--muted);padding-top:1px}
.entry .b{white-space:pre-wrap;font-size:13.5px;min-width:0;overflow-wrap:anywhere}
.entry .b b{font-weight:600}
.entry .b .sub{color:var(--muted);font-size:12.5px}
.addform{display:grid;gap:8px;background:var(--surface-2);border-radius:10px;padding:10px}
.compose{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.compose .c-row{display:flex;gap:8px;align-items:baseline;padding:7px 10px;border-bottom:1px solid var(--line);font-size:13px}
.compose .c-row .k{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);width:54px;flex:none}
.compose .c-row .v{flex:1;min-width:0;overflow-wrap:anywhere}
.compose .c-body{padding:10px;white-space:pre-wrap;font-size:13px;line-height:1.55}
.compose .c-row input{border:1px solid transparent;background:none;border-radius:5px;padding:2px 5px;width:100%;min-width:0}
.compose .c-row input:hover{border-color:var(--line)}
.compose .c-row input:focus{border-color:var(--accent);outline:none}
.compose textarea.c-edit{display:block;width:100%;border:0;padding:12px;font-size:13.5px;line-height:1.6;min-height:200px;resize:none;overflow:hidden;background:var(--surface);outline:none}
.compose:focus-within{border-color:var(--accent)}
.to-who{font-size:12.5px;color:var(--muted);white-space:nowrap}
.due.when{color:var(--accent);font-weight:600;cursor:default}
.compose .c-tools{display:flex;gap:6px;align-items:center;justify-content:flex-end;padding:5px 8px;border-bottom:1px solid var(--line);background:var(--surface-2);font-size:12px;color:var(--muted)}
.warn button.more{color:var(--miss-fg);text-decoration:underline}

/* Preview-only sample data, used when this view has no saved database (marked as examples). */
const DEMO={"me":{"name":"Zack","portfolio":"zackzand.com","reel":"","phone":"","intro":"I'm finishing my MA in Motion Media Design at SCAD this November. Before grad school I worked in 2D TV animation as a rigging artist and animator on shows like Wild Kratts and The Loud House, and I've been moving into motion design and broadcast graphics."},"templates":[{"id":"tpl-intro","name":"First outreach","subject":"Motion designer interested in {{company}}","body":"Hi {{first_name}},\n\n{{my_intro}}\n\n{{why_them}}\n\nI'd love to be considered for {{role_i_want}} work at {{company}}, whether that's a staff role or freelance. My reel and portfolio are at {{my_portfolio}}.\n\nWould you have 15 minutes in the next couple of weeks to talk about how your team is staffing up?\n\nThanks,\n{{my_name}}"},{"id":"tpl-check","name":"Check-in (no reply yet)","subject":"Re: Motion designer interested in {{company}}","body":"Hi {{first_name}},\n\nJust floating this back to the top of your inbox. I'm still very interested in {{role_i_want}} work at {{company}}, and I'm moving to New York after I graduate in November.\n\nReel and portfolio: {{my_portfolio}}\n\nThanks again,\n{{my_name}}"},{"id":"tpl-app","name":"Application follow-up","subject":"Following up on my {{role_i_want}} application","body":"Hi {{first_name}},\n\nI applied for the {{role_i_want}} role at {{company}} recently and wanted to follow up directly. {{why_them}}\n\nMy portfolio is at {{my_portfolio}}. Happy to send anything else you need.\n\nBest,\n{{my_name}}"},{"id":"tpl-thanks","name":"Thank you after interview","subject":"Thank you, {{first_name}}","body":"Hi {{first_name}},\n\nThanks for taking the time to talk today. I enjoyed learning more about the team at {{company}}, and I'm even more excited about the {{role_i_want}} role.\n\nLet me know if there's anything else I can send your way.\n\nBest,\n{{my_name}}"},{"id":"tpl-referral","name":"Ask a friend for a referral","subject":"Quick favor about {{company}}","body":"Hey {{first_name}},\n\nHope you're doing well! I'm going after {{role_i_want}} roles at {{company}} and wanted to ask if you'd be open to passing my name along, or pointing me to the right person on the production side.\n\nHere's my portfolio: {{my_portfolio}}\n\nNo pressure at all, and thanks either way.\n{{my_name}}"}],"companies":[{"id":"co-buck","name":"Buck","order":1,"example":true,"meta":{"priority":"Dream","role":"Motion Designer","city":"New York","contact":{"name":"Jordan Placeholder","role":"Producer","email":""},"website":"https://buck.co","tags":["Studio"],"prep":[{"t":"Cut a reel version that leads with character work","done":true},{"t":"Find a producer's email in Apollo","done":false}],"status":"gathering"},"auto":{},"due":null},{"id":"co-psyop","name":"Psyop","order":2,"example":true,"meta":{"priority":"Strong","role":"Motion Designer","city":"New York","contact":{"name":"Sam Example","role":"Recruiter","email":"sam@example.com"},"website":"https://www.psyop.com","why":"Your team's mix of 2D character animation and design-driven spots is exactly the kind of work I want to be doing.","tags":["Studio"],"status":"reached"},"auto":{},"due":"2026-10-27"},{"id":"co-loyal","name":"loyalkaspar","order":3,"example":true,"meta":{"priority":"Dream","role":"Broadcast Designer","city":"New York","contact":{"name":"Alex Sample","role":"Head of Production","email":"alex@example.com"},"website":"https://loyalkaspar.com","why":"Your network rebrands are a big reason I moved toward broadcast graphics.","tags":["Broadcast","Studio"],"prep":[{"t":"Broadcast-first reel","done":false}],"status":"wroteback"},"auto":{},"due":null},{"id":"co-if","name":"Imaginary Forces","order":4,"example":true,"meta":{"priority":"Dream","role":"Designer / Animator","city":"New York","website":"https://www.imaginaryforces.com","tags":["Studio"],"status":"meeting","outcome":"hopeful"},"auto":{},"due":null},{"id":"co-gretel","name":"Gretel","order":5,"example":true,"meta":{"priority":"Strong","role":"Motion Designer","city":"New York","tags":["Studio"]},"auto":{},"due":null},{"id":"co-msg","name":"MSG Networks","order":6,"example":true,"meta":{"priority":"Backup","role":"Broadcast Graphics Designer","city":"New York","tags":["Broadcast","In-house"],"status":"applied"},"auto":{},"due":null}],"chains":{"ch-ex1":{"id":"ch-ex1","companyId":"co-psyop","title":"Intro to Sam","started":"2026-10-20","summary":null,"messages":[{"id":"m-ex1","dir":"out","date":"2026-10-20","text":"Subject: Motion designer interested in Psyop\n\nHi Sam,\n\nI'm finishing my MA in Motion Media Design at SCAD this November... (example email)\n\nThanks,\nZack"}]},"ch-ex2":{"id":"ch-ex2","companyId":"co-loyal","title":"Broadcast Designer application","started":"2026-10-14","summary":null,"messages":[{"id":"m-ex2","dir":"out","date":"2026-10-14","text":"Subject: Following up on my Broadcast Designer application\n\nHi Alex, I applied for the Broadcast Designer role recently and wanted to follow up directly... (example email)"},{"id":"m-ex3","dir":"in","date":"2026-10-26","text":"Hi Zack, thanks for following up. We're reviewing reels for the broadcast team over the next two weeks. Could you send a version of your reel that leads with your broadcast work? Happy to set up a call after that.\n\nAlex (example reply)"}]}},"pages":{"co-if":{"notes":[{"id":"n-ex1","date":"2026-10-21","text":"Met their design director at a portfolio review. (example)"}],"applications":[],"meetings":[{"id":"mt-ex1","date":"2026-10-24","kind":"meeting","with":"Design director (example)","notes":"Liked the rigging work; said to check back in December."}]},"co-msg":{"notes":[],"applications":[{"id":"a-ex1","date":"2026-10-18","role":"Broadcast Graphics Designer","link":"","result":""}],"meetings":[]}}};

/* ---------- helpers ---------- */
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=p=>p+'-'+Math.random().toString(36).slice(2,8)+Date.now().toString(36).slice(-4);
const clone=o=>o==null?o:JSON.parse(JSON.stringify(o));
const slug=s=>String(s||'').toLowerCase().replace(/[^a-z0-9]+/g,'_').replace(/^_+|_+$/g,'');
const norm=s=>String(s||'').toLowerCase().replace(/[^a-z0-9]/g,'');
const isPlain=o=>o&&typeof o==='object'&&!Array.isArray(o);
function deepMerge(a,b){const out=isPlain(a)?{...a}:{};for(const k in b){out[k]=isPlain(b[k])&&isPlain(out[k])?deepMerge(out[k],b[k]):b[k]}return out}
function todayISO(){const t=new Date();return `${t.getFullYear()}-${String(t.getMonth()+1).padStart(2,'0')}-${String(t.getDate()).padStart(2,'0')}`}
function addDays(iso,n){const[y,m,d]=iso.split('-').map(Number);const t=new Date(y,m-1,d+n);return `${t.getFullYear()}-${String(t.getMonth()+1).padStart(2,'0')}-${String(t.getDate()).padStart(2,'0')}`}
function daysUntil(iso){const[y,m,d]=iso.split('-').map(Number);const a=new Date(y,m-1,d);const t=new Date();return Math.round((a-new Date(t.getFullYear(),t.getMonth(),t.getDate()))/864e5)}
const validDate=d=>typeof d==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(d);
function fmtDate(iso,long){if(!validDate(iso))return iso||'';const[y,m,d]=iso.split('-').map(Number);const o=long?{month:'long',day:'numeric',year:'numeric'}:{month:'short',day:'numeric'};if(!long&&y!==new Date().getFullYear())o.year='numeric';return new Date(y,m-1,d).toLocaleDateString(undefined,o)}
function hostOf(u){try{return new URL(/^https?:/i.test(u)?u:'https://'+u).hostname.replace(/^www\./,'')}catch(e){return u}}

const byDate=(a,b)=>a.date<b.date?-1:a.date>b.date?1:0;

/* ---------- state ---------- */
const S={db:null,sample:null,aiOff:false};
const st={mode:'loading',board:null,companies:[],chains:{},pages:{},templates:[],me:{},
  view:'sheet',overlay:null,q:'',filter:'all',panel:null,pop:null,compose:{},draft:{},open:{},expanded:{},

const board=()=>st.board&&st.board.version===2?st.board:DEFAULT_BOARD;
const colById=id=>board().columns.find(c=>c.id===id);
const statusCol=()=>colById('status');
const company=id=>st.companies.find(c=>c.id===id);
const meta=(c,colId)=>c&&c.meta?c.meta[colId]:undefined;
const optList=col=>(col.options||[]).map(o=>typeof o==='string'?{id:o,label:o,group:'',color:''}:o);
function optionOf(col,id){return optList(col).find(o=>o.id===id)}
const optLabel=o=>(o.icon?esc(o.icon)+' ':'')+esc(o.label);
function colorFor(col,val,i){const o=optionOf(col,val);if(o&&o.color)return o.color;const idx=(col.options||[]).indexOf(val);return COLORS[((idx<0?norm(val).length:idx)%(COLORS.length-1))+1]}
function colShows(col,c){if(!col.showWhen)return true;const v=meta(c,col.showWhen.col);return (col.showWhen.values||[]).includes(v)}
const chainsOf=cid=>Object.values(st.chains).filter(ch=>ch.companyId===cid).sort((a,b)=>(a.started||'')<(b.started||'')?-1:1);
const pageOf=cid=>{const p=st.pages[cid]||{};return {notes:p.notes||[],applications:p.applications||[],meetings:p.meetings||[]}};
const hasStatus=id=>!!optionOf(statusCol(),id);

/* ---------- storage (live db, or in-memory preview) ---------- */
const queues={};
function enqueue(path,fn){const p=(queues[path]||Promise.resolve()).then(fn).catch(dbFail);queues[path]=p;return p}
function dbFail(e){console.warn(e);const code=e&&e.code;
  if(code==='quota_exceeded')toast('Storage is full. Delete some companies or emails, then try again.');
  else if(code==='invalid_argument')toast("That change couldn't be saved. You may only have view access.");
  else toast("Couldn't save that change. Try again in a moment.")}
function localApply(path,data,op){
  const [col,id]=path.split('/');
  const upsertArr=(arr)=>{const i=arr.findIndex(x=>x.id===id);if(op==='del'){if(i>=0)arr.splice(i,1)}else if(op==='patch'){if(i>=0)arr[i]=deepMerge(arr[i],data)}else{const v={id,...clone(data)};if(i>=0)arr[i]=v;else arr.push(v)}};
  if(col==='companies')upsertArr(st.companies);
  else if(col==='templates')upsertArr(st.templates);
  else if(col==='chains'){if(op==='del')delete st.chains[id];else st.chains[id]={id,...(op==='patch'?deepMerge(st.chains[id],data):clone(data))}}
  else if(col==='pages'){if(op==='del')delete st.pages[id];else st.pages[id]=op==='patch'?deepMerge(st.pages[id],data):clone(data)}
  else if(path==='config/board')st.board=clone(data);
  else if(path==='settings/me')st.me=clone(data);
  render();
}
function put(path,data){if(!S.db){localApply(path,data,'set');return Promise.resolve()}return enqueue(path,()=>S.db.doc(path).set(data))}
function patch(path,data){if(!S.db){localApply(path,data,'patch');return Promise.resolve()}return enqueue(path,()=>S.db.doc(path).update(data))}
function del(path){if(!S.db){localApply(path,null,'del');return Promise.resolve()}return enqueue(path,()=>S.db.doc(path).delete())}

/* ---------- value display ---------- */
function valueText(col,v){
  if(v==null||v==='')return '';
  switch(col.type){
    case 'status':{const o=optionOf(col,v);return o?o.label:''}
    case 'checkbox':return v?'Yes':'No';
    case 'date':return fmtDate(v,true);
    case 'person':return v.name||'';
    case 'tags':return (v||[]).join(', ');
    case 'checklist':return '';
    default:return String(v);
  }
}
function cellHTML(col,v){
  const empty='<span class="empty-v">—</span>';
  switch(col.type){
    case 'status':{const o=optionOf(col,v);return o?`<span class="tag c-${o.color||'grey'}">${optLabel(o)}</span>`:empty}
    case 'checkbox':return `<span class="cb ${v?'on':''}">${v?'<svg width="10" height="10" viewBox="0 0 10 10"><path d="M1.5 5.2 4 7.6 8.6 2.4" fill="none" stroke="currentColor" stroke-width="1.8"/></svg>':''}</span>`;
    case 'date':return v?esc(fmtDate(v)):empty;
    case 'link':return v?`<a class="lnk" href="${esc(hrefOf(v))}" target="_blank" rel="noopener" data-act="noop">${esc(hostOf(v))}</a>`:empty;
    case 'person':return v&&(v.name||v.email)?`<span class="person"><span>${esc(v.name||v.email)}</span>${v.role?`<small>${esc(v.role)}</small>`:''}</span>`:empty;
    case 'values':return v?`<span class="tag c-${colorFor(col,v)}">${esc(v)}</span>`:empty;
    case 'tags':return v&&v.length?v.map(t=>`<span class="tag c-${colorFor(col,t)}">${esc(t)}</span>`).join(''):empty;
    case 'checklist':{const it=v||[];if(!it.length)return empty;const d=it.filter(i=>i.done).length;return `<span class="cl"><span class="bar"><span style="width:${Math.round(d/it.length*100)}%"></span></span>${d}/${it.length}</span>`}
    case 'longtext':return v?esc(String(v).split('\n')[0]):empty;
    default:return v!==''&&v!=null?esc(v):empty;
  }
}
function mdy(iso){const[y,m,d]=iso.split('-').map(Number);return `${m}/${d}`}
function nextMeeting(cid){const t=todayISO();return pageOf(cid).meetings.filter(m=>m.date>=t).sort((a,b)=>a.date===b.date?((a.start||'')<(b.start||'')?-1:1):a.date<b.date?-1:1)[0]}
function whenHTML(c){const m=c&&nextMeeting(c.id);if(!m)return dueHTML(c);
  const head=`${mdy(m.date)}${m.start?' at '+fmtTime(m.start)+(m.end?'–'+fmtTime(m.end):''):''}`;const sub=`${m.kind==='interview'?'Interview':'Meeting'}${m.with?' with '+m.with:''}`;
  return `<span class="due when" data-tip="${esc(head)}" data-tip2="${esc(sub)}" tabindex="0">${mdy(m.date)}</span>`}
function dueHTML(c){
  if(!c||!c.due)return '';const d=daysUntil(c.due);

const ALIASES={la:'los angeles',nyc:'new york',ny:'new york',sf:'san francisco',dc:'washington',atl:'atlanta',chi:'chicago',bk:'brooklyn',philly:'philadelphia',nola:'new orleans',ldn:'london',tor:'toronto',van:'vancouver',mtl:'montreal',sav:'savannah',pdx:'portland',sea:'seattle',bos:'boston',atx:'austin',slc:'salt lake city',lv:'las vegas',hk:'hong kong',uk:'united kingdom',us:'united states',usa:'united states',mograph:'motion graphics',vfx:'visual effects',fx:'effects',ad:'advertising',ads:'advertising',tv:'television'};

/* ---------- emails: tokens + compose ---------- */
const ME_TOKENS=[['my_name','Your name'],['my_portfolio','Portfolio'],['my_reel','Reel link'],['my_intro','Intro paragraph'],['my_phone','Phone']];
function tokenGroups(){
  return [
    {name:'Contact',items:[['first_name','First name'],['contact_name','Full name'],['contact_role','Role']]},
    {name:'Company',items:[['company','Company name'],...board().columns.filter(c=>c.type!=='checklist').map(c=>[slug(c.name),c.name])]},
    {name:'You',items:ME_TOKENS}
  ];
}
function personsOf(c){return board().columns.filter(x=>x.type==='person').map(col=>({col,p:meta(c,col.id)})).filter(x=>x.p&&(x.p.name||x.p.email))}
function tokenMap(c,p){
  const m={};const name=(p&&p.name||'').trim();
  m.first_name=name.split(/\s+/)[0]||'';m.contact_name=name;m.contact_role=p&&p.role||'';m.company=c&&c.name||'';
  board().columns.forEach(col=>{m[slug(col.name)]=valueText(col,meta(c,col.id))});
  const me=st.me||{};m.my_name=me.name||'';m.my_portfolio=me.portfolio||'';m.my_reel=me.reel||'';m.my_intro=me.intro||'';m.my_phone=me.phone||'';
  return m;
}
const TOK=/\{\{\s*([a-z0-9_]+)\s*\}\}/g;
const fillText=(t,m)=>String(t||'').replace(TOK,(x,k)=>m[k]?m[k]:x);
function fillHTML(t,m){t=String(t||'');let out='',last=0;t.replace(TOK,(x,k,i)=>{out+=esc(t.slice(last,i));out+=m[k]?`<span class="tok-fill">${esc(m[k])}</span>`:`<mark class="tok-miss">${esc(tokenLabel(k))}</mark>`;last=i+x.length;return x});return out+esc(t.slice(last))}
function missingOf(t,m){const s=new Set();String(t||'').replace(TOK,(x,k)=>{if(!m[k])s.add(k);return x});return [...s]}
function tokenLabel(k){for(const g of tokenGroups())for(const [id,l] of g.items)if(id===k)return (g.name==='Contact'?'Contact '+l.toLowerCase():l);return `{{${k}}}`}
function tokenFix(k,c){
  if(['first_name','contact_name','contact_role'].includes(k)){const pc=board().columns.find(x=>x.type==='person');return pc?`<button class="more" data-act="edit-cell" data-cid="${esc(c.id)}" data-col="${esc(pc.id)}">add it</button>`:''}
  if(k.startsWith('my_'))return `<button class="more" data-act="open-me">add it</button>`;
  const col=board().columns.find(x=>slug(x.name)===k);
  if(col){const act=col.type==='checkbox'?'toggle-check':col.type==='values'||col.type==='status'?'pick':'edit-cell';return `<button class="more" data-act="${act}" data-cid="${esc(c.id)}" data-col="${esc(col.id)}">set it</button>`}
  return '(not a field, check the template)';
}
function defaultCompose(cid){
  const c=company(cid);const cur=meta(c,'status');const o=optionOf(statusCol(),cur);
  const chs=chainsOf(cid);const last=chs[chs.length-1];
  const inChain=last&&['reached','wroteback','replied','meeting'].includes(cur);
  let tpl=o&&o.tpl?o.tpl:(cur?'':'tpl-intro');
  if(!st.templates.find(t=>t.id===tpl))tpl='';
  if(!tpl&&!cur&&st.templates[0])tpl=st.templates[0].id;
  return {target:inChain?last.id:'new',tplId:tpl,personCol:'',edit:null,fromAI:false,followDays:7};

const placeholder=k=>'['+tokenLabel(k)+']';
const fillPH=(t,m)=>String(t||'').replace(TOK,(x,k)=>m[k]?m[k]:placeholder(k));
function buildEmail(c){
  const ps=personsOf(c);const sel=ps.find(x=>x.col.id===st.compose.personCol)||ps[0];const p=sel&&sel.p;
  const m=tokenMap(c,p);const tpl=st.templates.find(t=>t.id===st.compose.tplId);
  let ed=st.compose.edit;
  if(!ed||!ed.dirty){ed={subject:fillPH(tpl&&tpl.subject,m),body:fillPH(tpl&&tpl.body,m),dirty:false};st.compose.edit=ed}
  else for(const k in m){if(!m[k])continue;const ph=placeholder(k);if(ed.subject.includes(ph))ed.subject=ed.subject.split(ph).join(m[k]);if(ed.body.includes(ph))ed.body=ed.body.split(ph).join(m[k])}
  const keys=new Set(Object.keys(m));String((tpl&&tpl.subject||'')+(tpl&&tpl.body||'')).replace(TOK,(x,k)=>{keys.add(k);return x});
  const missing=[...keys].filter(k=>!m[k]&&(ed.subject.includes(placeholder(k))||ed.body.includes(placeholder(k))));
  return {ps,sel,p,m,subject:ed.subject,body:ed.body,to:p&&p.email||'',missing};
}
const GENERIC=/^(info|hello|hi|hey|jobs|job|careers|career|contact|team|hr|recruit|recruiting|recruitment|talent|studio|admin|office|press|work|apply|hiring|general|mail|inquiries|enquiries|production|newbiz|support|people)$/;
function guessName(email){const local=String(email).split('@')[0].toLowerCase().replace(/\d+/g,'');const parts=local.split(/[._-]+/).filter(x=>x.length>1&&/^[a-z]+$/.test(x));
  if(!parts.length||parts.some(x=>GENERIC.test(x)))return '';const cap=x=>x[0].toUpperCase()+x.slice(1);return parts.length>=2?parts.slice(0,2).map(cap).join(' '):''}
async function saveRecipientEmail(value){
  const cid=st.panel;const c=company(cid);if(!c)return;const E=buildEmail(c);const v=value.trim();
  const col=E.sel?E.sel.col:board().columns.find(x=>x.type==='person');

  if(v===(cur.email||'')){return}
  const local=v.split('@')[0].toLowerCase();const first=norm((cur.name||'').split(/\s+/)[0]);
  const newPerson=!name||(cur.email&&first&&!norm(local).includes(first));
  if(v&&newPerson){name=guessName(v)||'';
    if(!name&&S.sample&&!S.aiOff&&!GENERIC.test(v.split('@')[0].toLowerCase())){try{const r=await S.sample.json(`Guess the person's name from this work email address: ${v}\nReply with only JSON {"name": "First Last"}. Use "" if it's a shared inbox or you can't tell. A lone first name is fine.`,{modelTier:'quick'});name=String(r&&r.name||'').trim()}catch(e){}}}
  await setMeta(cid,col.id,{name,role:newPerson&&cur.email?'':(cur.role||''),email:v});
  toast(v?`Saved to ${col.name}${name?`: ${name}`:'. Add their name on the Details card.'}`:`Removed the email from ${col.name}`);
}

/* ---------- status automation ---------- */
function autoStatus(cid,event,kind){
  const c=company(cid);if(!c)return null;const cur=meta(c,'status')||'';
  const outreach=['','gathering','reached','wroteback','replied'];let next=null;
  if(event==='sent'){if(cur===''||cur==='gathering')next='reached';else if(cur==='wroteback')next='replied'}
  else if(event==='received'){if(outreach.includes(cur))next='wroteback'}
  else if(event==='applied'){if(cur===''||cur==='gathering')next='applied'}
  else if(event==='meeting'){if(cur!=='meeting'&&cur!=='interview')next=(kind==='interview'||cur==='applied'||cur==='rejected')&&hasStatus('interview')?'interview':'meeting'}
  if(next&&hasStatus(next)&&next!==cur){setMeta(cid,'status',next);return optionOf(statusCol(),next).label}
  return null;
}

/* ---------- popovers: picker + cell editor ---------- */
function showPop(anchor,html){
  const p=$('#pop');p.innerHTML=html;p.hidden=false;
  const r=anchor.getBoundingClientRect();const w=p.offsetWidth,h=p.offsetHeight;
  let left=Math.max(12,Math.min(r.left,window.innerWidth-w-12));let top=r.bottom+6;if(top+h>window.innerHeight-12)top=Math.max(12,r.top-h-6);
  p.style.left=left+'px';p.style.top=top+'px';
  const f=p.querySelector('input:not([type=checkbox]),textarea,select');if(f)f.focus();
}
function closePop(){st.pop=null;$('#pop').hidden=true}
function pickerItems(){
  const col=colById(st.pop.colId);const q=norm(st.pop.q);const opts=optList(col);
  if(!q)return opts.map((o,i)=>({o,s:0,i}));
  const scored=opts.map((o,i)=>{const l=norm(o.label);const words=String(o.label).toLowerCase().split(/[^a-z0-9]+/).filter(Boolean);
    const s=l.startsWith(q)?0:words.some(w=>w.startsWith(q))?1:l.includes(q)?2:-1;return {o,s,i}}).filter(x=>x.s>=0);
  if(scored.length)return scored.sort((a,b)=>a.s-b.s||a.i-b.i);
  return opts.map((o,i)=>({o,s:3,i})).filter(x=>norm(x.o.group).includes(q));
}
function hiMatch(label,q){q=String(q||'').trim().toLowerCase();if(!q)return esc(label);const i=label.toLowerCase().indexOf(q);if(i<0)return esc(label);return esc(label.slice(0,i))+'<mark>'+esc(label.slice(i,i+q.length))+'</mark>'+esc(label.slice(i+q.length))}
function pickerListHTML(){
  const col=colById(st.pop.colId);const cur=meta(company(st.pop.cid),col.id);const items=pickerItems();const q=st.pop.q.trim();let g=null;
  if(st.pop.hi>=items.length)st.pop.hi=Math.max(0,items.length-1);
  return items.map(({o},i)=>{let gh='';if(!q&&o.group!==g){g=o.group;gh=o.group?`<div class="pk-group">${esc(o.group)}</div>`:''}
    return gh+`<button class="pk-item c-${o.color||colorFor(col,o.id)} ${i===st.pop.hi?'hi':''}" data-act="pick-opt" data-i="${i}"><span class="dot"></span>${o.icon?esc(o.icon)+' ':''}${hiMatch(o.label,q)}${o.id===cur?'<span class="cur">current</span>':''}${q&&o.group?`<span class="grp">${esc(o.group)}</span>`:''}${i===st.pop.hi?'<span class="pk-enter">↵</span>':''}</button>`}).join('')||'<div class="small muted" style="padding:6px">No match. Edit choices from the column header.</div>';
}

let noticeT=null;

function renderNotice(){
  const el=$('#notice');const n=st.notice;const go=$('#quick-go');
  const busy=!!(n&&n.busy);go.disabled=busy&&n.kind==='quick';go.textContent=busy&&n.kind==='quick'?'Thinking…':'Update';
  if(!n){el.hidden=true;clearTimeout(noticeT);return}
  el.hidden=false;el.className='notice';
  if(n.busy){el.innerHTML=`<div class="muted">${esc(n.text)}…</div>`;return}
  if(n.kind==='lookup'){
    el.innerHTML=`<div class="n-msg">${esc(n.msg)}</div>${n.cands&&n.cands.length?`${n.done?'<div class="small muted">Not it? Did you mean:</div>':''}<div class="cands">${n.cands.map((x,i)=>`<button class="cand" data-act="pick-cand" data-i="${i}"><b>${esc(x.name)}</b><small>${esc(x.about)}</small></button>`).join('')}</div>`:''}${n.ask?'<div class="n-actions"><button class="btn ghost small" data-act="notice-dismiss">None of these</button></div>':''}`;
    if(!n.ask)scheduleHide(n.cands&&n.cands.length?6000:3500);return}
  if(n.error){el.innerHTML=`<div>${esc(n.error)}</div>`;scheduleHide(4000);return}
  if(n.kind==='done'){el.className='notice done';el.innerHTML=`<div class="n-head"><b>Updated</b><span class="row" style="gap:6px"><button class="btn small" data-act="quick-undo">Undo</button><button class="icon-btn" data-act="notice-dismiss" aria-label="Close">×</button></span></div><ul>${n.lines.map(l=>`<li>${esc(l)}</li>`).join('')}</ul>`;scheduleHide(7000);return}
  if(!n.lines.length){el.innerHTML=`<div class="n-msg">${esc(n.reply||'Nothing to change.')}</div>`;scheduleHide(6000);return}
  el.innerHTML=`${n.reply?`<div class="n-msg">${esc(n.reply)}</div>`:''}<ul>${n.lines.map(l=>`<li>${esc(l)}</li>`).join('')}</ul><div class="n-actions"><button class="btn primary small" data-act="quick-apply">Apply</button><button class="btn ghost small" data-act="notice-dismiss">Discard</button></div>`;
}
function findCompany(name,extra){const n=norm(name);if(!n)return null;const all=st.companies.concat(extra||[]);
  return all.find(c=>norm(c.name)===n)||all.find(c=>norm(c.name).startsWith(n)||n.startsWith(norm(c.name)))||null}
function colByName(name){const n=norm(name);return board().columns.find(c=>norm(c.name)===n)}
function coerce(col,v){
  if(v==null||v==='')return undefined;
  switch(col.type){
    case 'number':{const n=Number(v);return isNaN(n)?undefined:n}
    case 'checkbox':return !!v;
    case 'tags':return (Array.isArray(v)?v:String(v).split(',')).map(x=>String(x).trim()).filter(Boolean);
    case 'person':return isPlain(v)?{name:String(v.name||''),role:String(v.role||''),email:String(v.email||'')}:{name:String(v),role:'',email:''};
    case 'link':{const s=String(v).trim();return s?hrefOf(s):undefined}
    case 'date':return validDate(v)?v:undefined;
    case 'status':{const o=optList(col).find(x=>norm(x.label)===norm(v)||x.id===v);return o?o.id:undefined}
    case 'checklist':return undefined;
    default:return String(v);
  }
}
function addMissingOptions(col,vals){
  if(col.type!=='values'&&col.type!=='tags')return;const opts=col.options||[];
  const add=(Array.isArray(vals)?vals:[vals]).filter(x=>!opts.some(o=>norm(o)===norm(x)));
  if(add.length){const b=clone(board());b.columns.find(x=>x.id===col.id).options=[...opts,...add];saveBoard(b)}
}
function matchOpt(col,v){if(col.type==='values'){const o=(col.options||[]).find(x=>norm(x)===norm(v));return o||v}if(col.type==='tags')return v.map(t=>(col.options||[]).find(x=>norm(x)===norm(t))||t);return v}
const sn=(col,id)=>{const o=optionOf(col,id);return o?o.label:id};
function describe(a){
  switch(a.type){
    case 'add_company':return `Add ${a.company}`;
    case 'set_status':return `${a.company} · ${a.column} → ${a.value}`;
    case 'log_email':return `${a.company} · email chain “${a.chain}”: ${a.dir==='in'?'email from them':'email you sent'} on ${fmtDate(a.date,true)}: “${a.text}”`;
    case 'add_note':return `${a.company} · note on ${fmtDate(a.date,true)}: “${a.text}”`;
    case 'add_application':return `${a.company} · application${a.role?' for '+a.role:''} on ${fmtDate(a.date,true)}${a.result?` (${a.result})`:''}`;
    case 'add_meeting':return `${a.company} · ${a.kind==='interview'?'interview':'meeting'}${a.with?' with '+a.with:''} on ${fmtDate(a.date,true)}${a.start?`, ${fmtTime(a.start)}${a.end?'–'+fmtTime(a.end):''}`:''}${a.notes?`: “${a.notes}”`:''}`;
    case 'set_follow_up':return `${a.company} · follow up on ${fmtDate(a.date,true)}`;
    case 'set_field':{const col=colByName(a.column);return `${a.company} · ${col?col.name:a.column}: ${Array.isArray(a.value)?a.value.join(', '):isPlain(a.value)?[a.value.name,a.value.role,a.value.email].filter(Boolean).join(', '):a.value}`}
  }return '';
}
function cleanActions(list){
  const out=[];
  for(const a of Array.isArray(list)?list:[]){
    if(!a||typeof a!=='object'||!a.company)continue;a.company=String(a.company).trim();
    const d=k=>{if(!validDate(a[k]))a[k]=todayISO()};
    switch(a.type){
      case 'add_company':out.push(a);break;
      case 'set_status':{const col=colByName(a.column||'Status');if(col&&col.type==='status'&&coerce(col,a.value)){a.column=col.name;a.value=sn(col,coerce(col,a.value));out.push(a)}break}
      case 'log_email':if(a.text){d('date');a.dir=a.dir==='in'?'in':'out';a.chain=String(a.chain||'Email chain');a.text=String(a.text);out.push(a)}break;
      case 'add_note':if(a.text){d('date');a.text=String(a.text);out.push(a)}break;
      case 'add_application':d('date');out.push(a);break;
      case 'add_meeting':{d('date');a.kind=a.kind==='interview'?'interview':'meeting';const tm=x=>typeof x==='string'&&/^\d{2}:\d{2}$/.test(x);if(!tm(a.start))a.start='';if(!tm(a.end))a.end='';out.push(a);break}
      case 'set_follow_up':if(validDate(a.date))out.push(a);break;
      case 'set_field':{const col=colByName(a.column);if(col&&col.type!=='status'&&coerce(col,a.value)!==undefined)out.push(a);break}
    }
  }
  return out;
}

  const statusCols=b.columns.filter(c=>c.type==='status').map(c=>`"${c.name}": ${optList(c).map(o=>`${o.label}${o.group?` (${o.group})`:''}`).join(', ')}${c.showWhen?` [only used once Status is ${c.showWhen.values.map(v=>sn(statusCol(),v)).join(' or ')}]`:''}`).join('\n');
  const prompt=`You update a job seeker's tracker from a short note they typed. They're a motion designer looking for work at ${MEDIA}. Today is ${todayISO()}.

Status columns and their choices:
${statusCols}
Status meanings: ${statusMeanings()}
Other fields: ${b.columns.filter(c=>c.type!=='status'&&c.type!=='checklist').map(c=>`${c.name} (${c.type}${c.options?`: ${c.options.join(', ')}`:''})`).join('; ')}
Companies already tracked: ${st.companies.map(c=>`${c.name} [Status: ${valueText(statusCol(),meta(c,'status'))||'none'}; chains: ${chainsOf(c.id).map(x=>x.title).join(' | ')||'none'}]`).join('; ')||'none'}

The note: """${text}"""

Reply with only JSON: {"confirm": false, "reply": "one short sentence saying what you understood", "actions": [ ... ]}
Set "confirm" to true only when you're genuinely unsure (which company is meant, an ambiguous date, conflicting details), and put the question in "reply". Otherwise false: the changes are applied straight away.
Action shapes:
{"type":"add_company","company":"Official name"}   only if not already tracked
{"type":"set_status","company":"Name","column":"Status","value":"<choice label>"}
{"type":"log_email","company":"Name","chain":"short chain title, reuse an existing title if it's the same thread","dir":"out"|"in","date":"YYYY-MM-DD","text":"one line on what the email said"}
{"type":"add_note","company":"Name","date":"YYYY-MM-DD","text":"short, past tense, in the job seeker's words"}
{"type":"add_application","company":"Name","date":"YYYY-MM-DD","role":"...","link":"","result":""}
{"type":"add_meeting","company":"Name","date":"YYYY-MM-DD","start":"HH:MM" or "","end":"HH:MM" or "","kind":"meeting"|"interview","with":"","notes":"how it went, or what it is if it hasn't happened yet"}
{"type":"set_follow_up","company":"Name","date":"YYYY-MM-DD"}
{"type":"set_field","company":"Name","column":"<field name>","value": ...}
Rules:
- Every separate event gets its own action with its own date. If the note says January for one thing and February for another, use two different dates.
- Record only what the note says. Never add an email, meeting, interview, application or outcome the note doesn't describe.
- Reaching out / emailing = log_email (dir "out"). A conversation, call, chat, coffee chat or virtual coffee = add_meeting (kind "meeting", or "interview" if they call it that). Feelings, impressions and things they learned = add_note.
- If the company reached out to the job seeker (email, LinkedIn, anywhere) and asked for something, Status is "${sn(statusCol(),'wroteback')}" (their move is done, the job seeker owes a reply). If they asked for a coffee chat or call with no date yet, add a note saying so; add_meeting only once there's a date.
- Set Status to the latest state. Set Outcome only when a meeting or interview happened and the note says how it went (e.g. not a good fit = Bad fit).
- Scheduled future meetings and interviews are add_meeting with their future date and 24-hour start/end times (12-12:20 pm = 12:00 to 12:20). Don't add a follow-up unless the note asks for a reminder.
- A month with no day means the 1st. A past event with no year is the most recent past one, never in the future. "Next week" etc. are relative to today.
- Use the tracked company's exact name when the note refers to it. Use the company's official spelling for new ones (e.g. BigStar, not Big Star).
- Treat abbreviations as the full thing (LA = Los Angeles, NYC = New York) and store full names in fields.
- If the note is too unclear to act on, return no actions and ask one short question in "reply".`;
  try{const r=await S.sample.json(prompt,{cache:false});const actions=cleanActions(r&&r.actions);const lines=actions.map(describe);

}

function applyQuick(actions,context){

  const created=[];const touchedChains={};const touchedPages={};

  const pageFor=cid=>touchedPages[cid]||(touchedPages[cid]=clone(pageOf(cid)));

    else if(a.type==='log_email'){let ch=Object.values(touchedChains).find(x=>x.companyId===c.id&&norm(x.title)===norm(a.chain))||chainsOf(c.id).find(x=>norm(x.title)===norm(a.chain));

    else if(a.type==='add_meeting'){pageFor(c.id).meetings.push({id:uid('mt'),date:a.date,kind:a.kind,with:String(a.with||''),notes:String(a.notes||''),start:a.start||'',end:a.end||''})}

async function lookupCompany(cid,typed,opts={}){
  const c=company(cid);if(!c)return;
  if(!S.sample||S.aiOff){toast('Company lookup uses AI, which works on the saved, published page.');return}
  if(!opts.quiet){st.notice={kind:'lookup',busy:true,text:`Looking up “${typed||c.name}”`};renderNotice()}
  const cols=fillableCols();
  const prompt=`A motion designer is adding a company to their job-hunt tracker. They work with ${MEDIA}.
They typed: "${typed||c.name}" (spacing, spelling or capitalization may be off).
${opts.context?`What they wrote about it: "${opts.context}"
`:''}Work out which real company they mean. List up to 4 candidates, best first. Set "sure": true when one is the obvious match: it's far better known (NBA = the basketball league), or the context makes it clear. Set "sure": false only when genuinely different companies are equally likely.
For each candidate give its official name, a one-line description (what they do and their main city), and these fields when you're confident (write city names in full, e.g. Los Angeles, not LA):
${cols.map(col=>`- ${col.name} (${col.type}${col.options?`, choose from: ${col.options.join(' | ')}`:''})`).join('\n')}
Tags fields are a list of strings. Links are full https URLs. City = main office most relevant to creative hiring.
Reply with only JSON: {"sure": true|false, "candidates": [{"name": "...", "about": "...", "fields": {"<field name>": <value>}}]}
If you don't know any matching company, return {"sure": false, "candidates": []}.`;
  try{
    const r=await S.sample.json(prompt,{cache:false});
    const cands=(r&&Array.isArray(r.candidates)?r.candidates:[]).filter(x=>x&&x.name).slice(0,4).map(x=>({name:String(x.name),about:String(x.about||''),fields:isPlain(x.fields)?x.fields:{}}));
    if(opts.quiet&&(!cands.length||r.sure)){if(cands.length){applyCandidate(cid,cands[0]);toast(`Filled in details for ${cands[0].name}`)}return}
    if(!cands.length)st.notice={kind:'lookup',cid,msg:`Couldn't find a media company called “${typed||c.name}”. Check the spelling, or fill the details in yourself.`,cands:[]};
    else if(r.sure){const filled=applyCandidate(cid,cands[0]);st.notice={kind:'lookup',cid,done:true,msg:`Filled in ${cands[0].name}${filled.length?`: ${filled.join(', ')}`:''}.`,cands:cands.slice(1)}}
    else st.notice={kind:'lookup',cid,ask:true,msg:`Which “${typed||c.name}” did you mean?`,cands};
  }catch(e){aiFail(e);if(opts.quiet)return;st.notice={kind:'lookup',cid,msg:`Couldn't look up ${c.name}. Try again from its page.`,cands:[]}}
  renderNotice();
}
function applyCandidate(cid,cand){
  const c=company(cid);if(!c)return [];const m={},auto={},names=[];
  for(const [k,v] of Object.entries(cand.fields||{})){
    const col=colByName(k);if(!col||!fillableCols().includes(col))continue;
    const cur=meta(c,col.id);const curEmpty=cur==null||cur===''||(Array.isArray(cur)&&!cur.length);
    if(!curEmpty&&!(c.auto&&c.auto[col.id]))continue;
    let val=coerce(col,v);if(val===undefined)continue;val=matchOpt(col,val);addMissingOptions(col,val);
    m[col.id]=val;auto[col.id]=true;names.push(col.name);
  }
  const upd={meta:m,auto};if(cand.name&&cand.name!==c.name)upd.name=cand.name;
  patch('companies/'+cid,upd);return names;
}

    const label=autoStatus(cid,'sent');st.compose.target=ch.id;st.compose.edit=null;st.compose.fromAI=false;
    toast(`Logged${label?`. Status → ${label}`:''}. Follow up ${fmtDate(due,true)}`);render()},
  'add-note'(){const cid=st.panel;const text=bindVal('note').trim();if(!text){toast('Write the note first');return}const p=clone(pageOf(cid));p.notes.push({id:uid('n'),date:bindVal('note_date')||todayISO(),text});st.draft.note='';savePage(cid,p);toast('Note added')},
  'add-app'(){const cid=st.panel;const role=bindVal('app_role').trim()||meta(company(cid),'role')||'';const p=clone(pageOf(cid));
    p.applications.push({id:uid('a'),date:bindVal('app_date')||todayISO(),role,link:bindVal('app_link').trim(),result:bindVal('app_result').trim()});
    ['app_role','app_link','app_result'].forEach(k=>st.draft[k]='');savePage(cid,p);const l=autoStatus(cid,'applied');toast(l?`Application added. Status → ${l}`:'Application added')},
  mkind(t){['m_with','m_notes','m_start','m_end','m_date'].forEach(k=>st.draft[k]=bindVal(k));st.draft.mkind=t.dataset.k;renderPanel()},
  'add-meeting'(){const cid=st.panel;const kind=st.draft.mkind||'meeting';const p=clone(pageOf(cid));
    p.meetings.push({id:uid('mt'),date:bindVal('m_date')||todayISO(),start:bindVal('m_start'),end:bindVal('m_end'),kind,with:bindVal('m_with').trim(),notes:bindVal('m_notes').trim()});
    ['m_with','m_notes','m_start','m_end'].forEach(k=>st.draft[k]='');savePage(cid,p);const l=autoStatus(cid,'meeting',kind);toast(l?`Added. Status → ${l}`:'Added')},
  'del-entry'(t){const cid=st.panel;const kind=t.dataset.kind;arm(t,'Delete?',()=>{const p=clone(pageOf(cid));p[kind]=p[kind].filter(x=>x.id!==t.dataset.id);savePage(cid,p)})},
  'clear-examples'(t){arm(t,'Click again to clear',async()=>{for(const c of st.companies.filter(c=>c.example))await deleteCompany(c.id);toast('Examples cleared')})},
  'tpl-select'(t){const tp=st.templates.find(x=>x.id===t.dataset.id);st.tplSel=tp.id;st.tplDraft=clone(tp);renderTemplates()},
  'tpl-new'(){const id=uid('tpl');st.tplSel=id;st.tplDraft={id,name:'New template',subject:'',body:'Hi {{first_name}},\n\n\n\nThanks,\n{{my_name}}'};renderTemplates();const n=$('#tpl-name');n&&n.select()},
  'tpl-save'(){const d=st.tplDraft;if(!d)return;put('templates/'+d.id,{name:d.name||'Untitled',subject:d.subject||'',body:d.body||''});toast('Template saved')},
  'tpl-delete'(t){const d=st.tplDraft;arm(t,'Click again to delete',()=>{del('templates/'+d.id);st.tplDraft=null;st.tplSel=null;toast('Template deleted')})},
  'tpl-token'(t){const d=st.tplDraft;if(!d)return;const field=st.tplFocus==='subject'?'subject':'body';const el=field==='subject'?$('#tpl-subject'):$('#tpl-body');const tok=`{{${t.dataset.k}}}`;
    const s=el.selectionStart??el.value.length,e=el.selectionEnd??el.value.length;el.value=el.value.slice(0,s)+tok+el.value.slice(e);d[field]=el.value;el.focus();el.selectionStart=el.selectionEnd=s+tok.length;const pv=$('#tpl-prev');if(pv)pv.innerHTML=tplPreviewHTML()},
  'quick-apply'(){const n=st.notice;if(!n||!n.actions)return;const undo=applyQuick(n.actions,n.text);st.notice={kind:'done',lines:n.lines,undo};$('#quick-input').value='';renderNotice()},
  'quick-undo'(){const n=st.notice;if(!n||!n.undo)return;const u=n.undo;st.notice=null;renderNotice();undoQuick(u)},
  'notice-dismiss'(){st.notice=null;renderNotice()},
  'pick-cand'(t){const n=st.notice;const cand=n.cands[Number(t.dataset.i)];if(!cand)return;const filled=applyCandidate(n.cid,cand);
    st.notice={kind:'lookup',cid:n.cid,done:true,msg:`Filled in ${cand.name}${filled.length?`: ${filled.join(', ')}`:''}.`,cands:[]};renderNotice()}
};

function closePanelSoft(){savePW();st.panel=null;$('#panel').hidden=true;document.body.classList.remove('panel-open','panel-push');$('#resizer').hidden=true;setTimeout(render,0)}
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-act]');const inPop=e.target.closest('#pop');
  if(st.panel&&!e.target.closest('#panel,#pop,#modal,#overlay,#resizer,.quick-wrap,#toast')&&!(t&&t.dataset.act==='open-company'))closePanelSoft();
  if(!inPop&&st.pop&&!(t&&t.closest('#modal')))closePop();
  if(!t||t.disabled)return;
  const fn=H[t.dataset.act];if(fn){if(t.dataset.act!=='noop')e.preventDefault();fn(t,e)}
});
document.addEventListener('change',e=>{
  const t=e.target;const k=t.dataset&&t.dataset.change;if(!k)return;
  if(k==='due')patch('companies/'+st.panel,{due:t.value||null});
  else if(k==='person'){st.compose.personCol=t.value;renderPanel()}
  else if(k==='tpl'){if(t.value){st.compose.tplId=t.value;st.compose.edit=null;st.compose.fromAI=false}renderPanel()}
  else if(k==='to-email')saveRecipientEmail(t.value);
  else if(k==='tpl-prev'){st.tplPrev=t.value;$('#tpl-prev').innerHTML=tplPreviewHTML()}
  else if(k==='col-sheet'){const b=clone(board());const col=b.columns.find(x=>x.id===t.dataset.id);col.onSheet=t.checked;saveBoard(b)}
  else if(k==='target'){st.compose.target=t.value;renderPanel()}
  else if(k==='follow')st.compose.followDays=Number(t.value);
  else if(k==='tag-toggle'){const p=st.pop;const c=company(p.cid);const cur=new Set(meta(c,p.colId)||[]);t.checked?cur.add(t.value):cur.delete(t.value);const col=colById(p.colId);setMeta(p.cid,p.colId,(col.options||[]).filter(o=>cur.has(o)).concat([...cur].filter(o=>!(col.options||[]).includes(o))))}
  else if(k==='cl-toggle'){st.pop.items[Number(t.dataset.i)].done=t.checked;refreshChecklist()}
  else if(k==='mc-type')$('#mc-opts-wrap').hidden=!['values','tags','status'].includes(t.value);
});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.id==='search'){st.q=t.value;render();return}
  if(t.id==='pk-q'){st.pop.q=t.value;st.pop.hi=0;$('#pk-list').innerHTML=pickerListHTML();return}
  if(t.dataset&&t.dataset.bind){st.draft[t.dataset.bind]=t.value;return}
  if(t.dataset&&t.dataset.cedit&&st.compose.edit){st.compose.edit[t.dataset.cedit]=t.value;st.compose.edit.dirty=true;if(t.tagName==='TEXTAREA')grow(t);return}
  if(t.dataset&&t.dataset.tpl&&st.tplDraft){st.tplDraft[t.dataset.tpl]=t.value;const pv=$('#tpl-prev');if(pv)pv.innerHTML=tplPreviewHTML()}
});
document.addEventListener('focusin',e=>{const t=e.target;if(t.id==='tpl-subject')st.tplFocus='subject';else if(t.id==='tpl-body')st.tplFocus='body'});
document.addEventListener('keydown',e=>{
  const t=e.target;
  if(t.id==='pk-q'){const n=pickerItems().length;
    if(e.key==='ArrowDown'){e.preventDefault();st.pop.hi=Math.min(n-1,st.pop.hi+1);$('#pk-list').innerHTML=pickerListHTML();return}
    if(e.key==='ArrowUp'){e.preventDefault();st.pop.hi=Math.max(0,st.pop.hi-1);$('#pk-list').innerHTML=pickerListHTML();return}
    if(e.key==='Enter'){e.preventDefault();pickOption(st.pop.hi);return}}
  if(e.key==='Enter'&&t.dataset&&t.dataset.change==='to-email'){e.preventDefault();t.blur();return}
  if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing&&t.dataset&&t.dataset.enter&&H[t.dataset.enter]){e.preventDefault();H[t.dataset.enter]();return}
  if(e.key==='Escape'){if(st.pop){closePop();return}if(!$('#modal').hidden){closeModal();return}if(st.overlay){H['close-templates']();return}if(st.panel){closePanel();return}}
  if(t.id==='new-company'&&e.key==='Enter'){e.preventDefault();addCompany(t.value);return}
  if(t.id==='cl-new'&&e.key==='Enter'){e.preventDefault();H['cl-add']();return}
  if(t.closest&&t.closest('#pop')&&e.key==='Enter'&&st.pop){if(t.tagName==='TEXTAREA'&&!(e.ctrlKey||e.metaKey))return;if(t.type==='checkbox')return;e.preventDefault();
    if(['cell','name','chain-title'].includes(st.pop.type))popSave();else if(st.pop.type==='colmenu')H['menu-save']()}
});
$('#modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});
$('#quick-form').addEventListener('submit',e=>{e.preventDefault();const v=$('#quick-input').value.trim();if(v&&!(st.notice&&st.notice.busy))runQuick(v)});

/* hover popups */
let tipT=null,tipEl=null;
document.addEventListener('mouseover',e=>{const el=e.target.closest&&e.target.closest('[data-tip]');const tp=$('#tip');
  if(el===tipEl)return;tipEl=el;clearTimeout(tipT);tp.hidden=true;if(!el)return;
  tipT=setTimeout(()=>{if(tipEl!==el||!el.isConnected)return;showTip(el)},350)});
function showTip(el){const tp=$('#tip');
  tp.innerHTML=`<b>${esc(el.dataset.tip)}</b>${el.dataset.tip2?`<span>${esc(el.dataset.tip2)}</span>`:''}`;tp.hidden=false;
  const r=el.getBoundingClientRect();const w=tp.offsetWidth,h=tp.offsetHeight;tp.style.left=Math.max(8,Math.min(r.left+r.width/2-w/2,window.innerWidth-w-8))+'px';tp.style.top=(r.top-h-8<8?r.bottom+8:r.top-h-8)+'px'}
document.addEventListener('scroll',()=>{clearTimeout(tipT);tipEl=null;$('#tip').hidden=true},true);
/* drag: board cards + page sections */
let dragId=null,dragMoved=false,dragSec=null;
document.addEventListener('dragstart',e=>{
  const g=e.target.closest&&e.target.closest('[data-grip]');
  if(g){dragSec=g.dataset.grip;const sec=g.closest('.psec');sec&&sec.classList.add('dragging');try{e.dataTransfer.setData('text/plain',dragSec);e.dataTransfer.effectAllowed='move';if(sec)e.dataTransfer.setDragImage(sec,20,20)}catch(_){}return}
  const c=e.target.closest&&e.target.closest('.card');if(!c)return;dragId=c.dataset.cid;dragMoved=true;c.classList.add('dragging');try{e.dataTransfer.setData('text/plain',dragId);e.dataTransfer.effectAllowed='move'}catch(_){}});
document.addEventListener('dragend',()=>{document.querySelectorAll('.dragging,.over').forEach(x=>x.classList.remove('dragging','over'));dragSec=null;dragId=null;setTimeout(()=>dragMoved=false,50)});
document.addEventListener('dragover',e=>{
  if(dragSec){const sec=e.target.closest&&e.target.closest('.psec');if(!sec)return;e.preventDefault();document.querySelectorAll('.psec.over').forEach(x=>x!==sec&&x.classList.remove('over'));sec.classList.add('over');return}
  const l=e.target.closest&&e.target.closest('.lane');if(!l||!dragId)return;e.preventDefault();document.querySelectorAll('.lane.over').forEach(x=>x!==l&&x.classList.remove('over'));l.classList.add('over')});
document.addEventListener('drop',e=>{
  if(dragSec){const sec=e.target.closest&&e.target.closest('.psec');if(!sec)return;e.preventDefault();const to=sec.dataset.sec;const from=dragSec;dragSec=null;if(to===from)return;
    const order=secOrder().filter(x=>x!==from);const r=sec.getBoundingClientRect();let i=order.indexOf(to);if(e.clientY>r.top+r.height/2)i++;order.splice(i,0,from);saveSecPrefs(order);renderPanel();return}
  const l=e.target.closest&&e.target.closest('.lane');if(!l||!dragId)return;e.preventDefault();l.classList.remove('over');const cid=dragId;dragId=null;const v=l.dataset.lane||null;
  const c=company(cid);if(!c||(meta(c,'status')||null)===v)return;setMeta(cid,'status',v);toast(`${c.name} → ${v?sn(statusCol(),v):'No status'}`)});

/* panel resize (drag the left edge, like Kitsu) */
let curPW=640;
function setPW(w){w=Math.round(Math.max(380,Math.min(w,window.innerWidth-160)));curPW=w;document.documentElement.style.setProperty('--pw',w+'px');updatePush();return w}
function savePW(){try{localStorage.setItem('sot-pw',String(curPW))}catch(_){}}
function updatePush(){document.body.classList.toggle('panel-push',!!st.panel&&window.innerWidth-curPW>=560)}
window.addEventListener('resize',updatePush);
try{const w=Number(localStorage.getItem('sot-pw'));if(w)setPW(w)}catch(e){}
(()=>{const rz=$('#resizer');let w=null;
  rz.addEventListener('pointerdown',e=>{e.preventDefault();try{rz.setPointerCapture(e.pointerId)}catch(_){}rz.classList.add('drag');document.body.style.userSelect='none'});
  rz.addEventListener('pointermove',e=>{if(rz.classList.contains('drag'))w=setPW(window.innerWidth-e.clientX)});
  const end=()=>{if(!rz.classList.contains('drag'))return;rz.classList.remove('drag');document.body.style.userSelect='';savePW()};
  rz.addEventListener('pointerup',end);rz.addEventListener('pointercancel',end);
})();

/* ---------- boot ---------- */
render();
(async()=>{
  let db=null,sample=null;
  try{db=window.claude&&window.claude.use?await window.claude.use('db'):null}catch(e){db=null}
  try{sample=window.claude&&window.claude.use?await window.claude.use('sample'):null}catch(e){sample=null}
  S.sample=sample;
  if(!db){st.mode='preview';const d=clone(DEMO)||{};st.me=d.me||{};st.templates=d.templates||[];st.companies=d.companies||[];st.chains=d.chains||{};st.pages=d.pages||{};render();return}
  S.db=db;
  const onErr=e=>{console.warn(e);if(e&&e.code!=='revoked')toast('Lost the connection to your saved data. Reload the page.')};
  db.doc('config/board').onSnapshot(s=>{st.board=s.exists?clone(s.data()):null;render()},onErr);
  db.collection('companies').onSnapshot(s=>{st.companies=s.docs.map(d=>({id:d.id,...clone(d.data())}));st.mode='live';render()},onErr);
  db.collection('chains').onSnapshot(s=>{const m={};s.docs.forEach(d=>m[d.id]={id:d.id,...clone(d.data())});st.chains=m;render()},onErr);
  db.collection('pages').onSnapshot(s=>{const m={};s.docs.forEach(d=>m[d.id]=clone(d.data()));st.pages=m;render()},onErr);
  db.collection('templates').onSnapshot(s=>{st.templates=s.docs.map(d=>({id:d.id,...clone(d.data())}));render()},onErr);
  db.doc('settings/me').onSnapshot(s=>{st.me=s.exists?clone(s.data()):{};render()},onErr);
})();
</script>
